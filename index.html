<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BenforMarket</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-claro">

    <div id="contenedor-alertas" class="contenedor-alertas"></div>

    <div class="envoltura-login">
        <div class="tarjeta-login">
            <div class="encabezado">
                <div class="caja-icono">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <h1>BenforMarket</h1>
                <p>Punto de Venta e Inventarios</p>
            </div>

            <form id="formulario-login">
                <div class="grupo-entrada">
                    <label for="correo">Email</label>
                    <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="grupo-entrada">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-principal">Entrar</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/autenticacion.js"></script>
</body>
</html>
